<!DOCTYPE html>
<html>
  <head {{ HEAD_ATTRS }}>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    {{ HEAD }}
    <script async="async" src="https://www.google.com/adsense/search/ads.js"></script>
    <script type="text/javascript" charset="utf-8">
      (function (g, o) {
        (g[o] =
          g[o] ||
          function () {
            (g[o]["q"] = g[o]["q"] || []).push(arguments);
          }),
          (g[o]["t"] = 1 * new Date());
      })(window, "_googCsa");
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-REMV44HR3E"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-REMV44HR3E");
    </script>
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-PZ8G2CCK");
    </script>
    <!-- End Google Tag Manager -->
    <script>
      window.bgdataLayer = window.bgdataLayer || [];
      function bge() {
        bgdataLayer.push(arguments);
      }
      bge("init", "904831856669662464");
    </script>
    <script async src="https://api.imotech.video/ad/events.js?pixel_id=904831856669662464"></script>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in window.navigator) {
          window.navigator.serviceWorker
            .register("/sw.js")
            .then(() => {})
            .catch(() => {});
        }
        window.addEventListener("beforeinstallprompt", (e) => {
          e.preventDefault();
          window.deferredPrompt = e;
        });
      });
    </script>
  </head>
  <body {{ BODY_ATTRS }} tabindex="0">
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-PZ8G2CCK"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    {{ APP }}
    <script>
      window.done = false;

      window.addEventListener("beforeunload", () => {
        if (window.done) return;
        const activeElement = document.activeElement;
        const src = activeElement.getAttribute("src");
        let eventName = "";

        if (src && src.indexOf("afs/ads?") !== -1) {
          if (activeElement.getAttribute("title")) {
            // tt - start
            const searchParams = new URLSearchParams(window.location.search);
            const channelId = searchParams.has("channel") ? searchParams.get("channel") : "";
            if (
              [
                "6033218701",
                "3264520910",
                "3324230667",
                "1119410166",
                "9972463713",
                "8392594638"
              ].indexOf(channelId) !== -1
            ) {
              try {
                // 发送数据到服务器
                fetch("https://api.tapmygame.com/api/common/stkrs", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    site_id: "headflash",
                    user_agent: navigator.userAgent,
                    // uid: HI_ID,
                    cid: channelId,
                    url: window.location.href,
                    tid: searchParams.has("ttclid") ? searchParams.get("ttclid") : ""
                  })
                });
              } catch (e) {}
            }
            // tt - end
            // 快手 - start
            // try {
            //   // 发送数据到服务器
            //   fetch("http://www.adsnebula.com/log/common/api", {
            //     method: "POST",
            //     headers: {
            //       "Content-Type": "application/json"
            //     },
            //     body: JSON.stringify({
            //       access_token: "ZubONfxCCsuhIZsapsbhO-ulFYL75ej-pyxnQOOLMcA",
            //       // clickid: searchParams.has("click_id") ? searchParams.get("click_id") : "",
            //       clickid: "QfAjmVSx4ahoE1JwKYjn9g",
            //       event_name: "EVENT_BUTTON_CLICK",
            //       pixelId: "259573969920614",
            //       testFlag: false,
            //       trackFlag: true, //测试时为true, 正式投放时为false
            //       is_attributed: 1,
            //       mmpcode: "PL",
            //       pixelSdkVersion: "9.9.9"
            //     })
            //   });
            // } catch (e) {}
            // 快手 - end
            // bigo - start
            try {
              bge("event", "button", { configId: "904831856669662464" });
            } catch (e) {}
            // bigo - end
            // try {
            //   kwaiq.instance("259483356799651").track("buttonClick");
            // } catch (e) {}
            eventName = "T_AR";
          } else {
            eventName = "T_AC";
          }
        } else if (src && src.indexOf("afs/ads/i/") !== -1) {
          // try {
          //   kwaiq.instance("259483356799651").track("buttonClick");
          // } catch (e) {}
          eventName = "T_AG";
        } else {
          let elementUrlIndex = window.dataLayer.findIndex(
            ({ event: eventType }) => "gtm.linkClick" === eventType
          );
          if (-1 !== elementUrlIndex) {
            eventName = "D_RE";
          }
        }
        eventName && dataLayer.push({ event: eventName });
        window.done = true;
      });

      window.addEventListener("blur", () => {
        const activeElement = document.activeElement;
        const src = activeElement.getAttribute("src");

        if (src && src.indexOf("afs/ads?") !== -1) {
          if (activeElement.getAttribute("title")) {
            dataLayer.push({ event: "D_AR" });
          } else {
            dataLayer.push({ event: "D_AC" });
          }
        }
      });

      window.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          setTimeout(() => {
            window.done = false;
            document.body.focus();
          }, 0);
        }
      });
    </script>
  </body>
</html>
