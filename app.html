    <script>
      // googletag.cmd.push(() => {
      //   googletag.display(interstitialSlot);
      //   googletag.display(anchorSlot);
      // });

      window.isUnloaded = false;
      window.done = false;

      window.addEventListener("beforeunload", () => {
        // 提取标志变量和事件索引
        const elementUrlIndex = window.dataLayer.findIndex(
          ({ event: eventType }) => "gtm.linkClick" === eventType
        );

        if (!window.isUnloaded && elementUrlIndex !== -1) {
          // 处理穿插广告埋点逻辑
          if (window.clickOpen === 1) {
            dataLayer.push({ event: "D_AL" });
          } else {
            dataLayer.push({ event: "D_RE" });
          }
          window.isUnloaded = true;
        }

        if (window.done) return;
        const activeElement = document.activeElement;
        const src = activeElement.getAttribute("src");
        let eventName = "";
        const searchParams = new URLSearchParams(window.location.search);
        const channelId = searchParams.has("channel") ? searchParams.get("channel") : "";

        if (src && src.indexOf("afs/ads?") !== -1) {
          if (activeElement.getAttribute("title")) {
            // 快手 - start
            try {
              // 发送数据到服务器
              fetch("http://www.adsnebula.com/log/common/api", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  access_token: "y0nbLvass0lrWxYORSc3ZnuWJxjHE28R6tEbMuKOYfg",
                  clickid: searchParams.has("click_id") ? searchParams.get("click_id") : "",
                  event_name: "EVENT_ADD_TO_CART",
                  pixelId: "261108496750613",
                  testFlag: false,
                  trackFlag: false, // 测试时为true, 正式投放时为false
                  is_attributed: 1,
                  mmpcode: "PL",
                  pixelSdkVersion: "9.9.9"
                })
              });
            } catch (e) {}
            // 快手 - end
            // bigo - start
            try {
              bge("event", "button", { configId: "904831856669662464" });
            } catch (e) {}
            // bigo - end
            eventName = "T_AR";
          } else {
            eventName = "T_AC";
          }
        } else if (src && src.indexOf("afs/ads/i/") !== -1) {
          // 点击购物广告
          eventName = "T_AG";
          // 快手 - start
          try {
            // 发送数据到服务器
            fetch("http://www.adsnebula.com/log/common/api", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                access_token: "3ISrR6AGATmm3353cvYTOiWtHDj02IaL_vwcIBljmPY",
                clickid: searchParams.has("click_id") ? searchParams.get("click_id") : "",
                event_name: "EVENT_ADD_TO_CART",
                pixelId: "260351615285613",
                testFlag: false,
                trackFlag: false, //测试时为true, 正式投放时为false
                is_attributed: 1,
                mmpcode: "PL",
                pixelSdkVersion: "9.9.9"
              })
            });
          } catch (e) {}
          // 快手 - end
        } else {
          let elementUrlIndex = window.dataLayer.findIndex(
            ({ event: eventType }) => "gtm.linkClick" === eventType
          );
          if (-1 !== elementUrlIndex) {
            eventName = "D_RE";
          }
        }
        eventName && dataLayer.push({ event: eventName });
        window.done = true;
      });

      // 监听 hash 变化事件 --- 判断穿插全屏广告出现
      window.addEventListener("hashchange", () => {
        if ("#google_vignette" == window.location.hash) {
          window.clickOpen = 1;
          // 触发穿插
          dataLayer.push({ event: "C_AL" });
        }
      });

      // 监听消息事件
      window.addEventListener("message", (event) => {
        if (
          '{"eventType":"adClosed","result":{"status":1},"googMsgType":"fullscreen"}' === event.data
        ) {
          window.clickOpen = 0;
          // 关闭穿插广告
          dataLayer.push({ event: "G_AL" });
        }
      });

      // 监听失去焦点事件
      window.addEventListener("blur", () => {
        const activeElement = document.activeElement,
          sourceAttribute = activeElement.getAttribute("src"),
          sourceAttribute1 = activeElement.getAttribute("name");

        //afs埋点
        if (sourceAttribute && sourceAttribute.indexOf("afs/ads?") !== -1) {
          if (activeElement.getAttribute("title")) {
            dataLayer.push({ event: "D_AR" });
          } else {
            dataLayer.push({ event: "D_AC" });
          }
        }

        //页内广告埋点
        if (
          sourceAttribute1 &&
          -1 !== sourceAttribute1.indexOf("google_ads_iframe_/23197833490") &&
          -1 === sourceAttribute1.indexOf("anchor_0")
        ) {
          let adStatus = "false";
          if (activeElement) {
            adStatus = activeElement.getAttribute("data-load-complete") || adStatus;
          }
          if ("true" == adStatus) {
            // 点击页内广告
            dataLayer.push({ event: "D_IP" });
          }
        } else if (sourceAttribute1 && -1 !== sourceAttribute1.indexOf("anchor_0")) {
          // 点击锚定广告
          dataLayer.push({ event: "D_FI" });
        }

        //adm锚定
        // if (
        //   activeElement.getAttribute("name") &&
        //   activeElement.getAttribute("name").indexOf("anchor_0") !== -1
        // ) {
        //   dataLayer.push({ event: "D_FI" });
        // }
      });

      window.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          setTimeout(() => {
            window.done = false;
            document.body.focus();
          }, 0);
        }
      });
    </script>
