    {{ APP }}
    <script>
      window.done = false;

      window.addEventListener("beforeunload", () => {
        if (window.done) return;
        const activeElement = document.activeElement;
        const src = activeElement.getAttribute("src");
        let eventName = "";

        if (src && src.indexOf("afs/ads?") !== -1) {
          if (activeElement.getAttribute("title")) {
            // tt - start
            const searchParams = new URLSearchParams(window.location.search);
            const channelId = searchParams.has("channel") ? searchParams.get("channel") : "";
            if (
              [
                "6033218701",
                "3264520910",
                "3324230667",
                "1119410166",
                "9972463713",
                "8392594638"
              ].indexOf(channelId) !== -1
            ) {
              try {
                // 发送数据到服务器
                fetch("https://api.tapmygame.com/api/common/stkrs", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    site_id: "headflash",
                    user_agent: navigator.userAgent,
                    // uid: HI_ID,
                    cid: channelId,
                    url: window.location.href,
                    tid: searchParams.has("ttclid") ? searchParams.get("ttclid") : ""
                  })
                });
              } catch (e) {}
            }
            // tt - end
            // bigo - start
            try {
              bge("event", "button", { configId: "904831856669662464" });
            } catch (e) {}
            // bigo - end
            try {
              kwaiq.instance("259483356799651").track("buttonClick");
            } catch (e) {}
            eventName = "T_AR";
          } else {
            eventName = "T_AC";
          }
        } else if (src && src.indexOf("afs/ads/i/") !== -1) {
          try {
            kwaiq.instance("259483356799651").track("buttonClick");
          } catch (e) {}
          eventName = "T_AG";
        } else {
          let elementUrlIndex = window.dataLayer.findIndex(
            ({ event: eventType }) => "gtm.linkClick" === eventType
          );
          if (-1 !== elementUrlIndex) {
            eventName = "D_RE";
          }
        }
        eventName && dataLayer.push({ event: eventName });
        window.done = true;
      });

      window.addEventListener("blur", () => {
        const activeElement = document.activeElement;
        const src = activeElement.getAttribute("src");

        if (src && src.indexOf("afs/ads?") !== -1) {
          if (activeElement.getAttribute("title")) {
            dataLayer.push({ event: "D_AR" });
          } else {
            dataLayer.push({ event: "D_AC" });
          }
        }
      });

      window.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          setTimeout(() => {
            window.done = false;
            document.body.focus();
          }, 0);
        }
      });
    </script>
