<!DOCTYPE html>
<html>
  <head {{ HEAD_ATTRS }}>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    {{ HEAD }}
    <script src="/linkMarking.js"></script>
    <script>
      const searchParams = new URLSearchParams(window.location.search);
      const ttclid = searchParams.get("ttclid");
      if (ttclid) {
        window.setCookie("hi_ttclid", ttclid);
      }
      const script = document.createElement("script");
      script.src = "https://wc.bunchthings.com/youknowwho.js?" + Date.now();
      document.head.appendChild(script);
      script.onload = function () {
        const pathname = window.location.pathname;
        if (pathname.startsWith("/detail")) {
          window.pushEventParamsToGtm("D_PV");
        } else if (pathname.startsWith("/search/")) {
          window.pushEventParamsToGtm("S_PV");
        }
      };
    </script>
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script>
      // VConsole 默认会挂载到 `window.VConsole` 上
      const search = window.location.search;
      if (search.indexOf("vconsole=true") > -1) {
        var vConsole = new window.VConsole();
      }
    </script>
    <script async="async" src="https://www.google.com/adsense/search/ads.js"></script>
    <script type="text/javascript" charset="utf-8">
      (function (g, o) {

    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in window.navigator) {
          window.navigator.serviceWorker
            .register("/sw.js")
            .then(() => {})
            .catch(() => {});
        }
        window.addEventListener("beforeinstallprompt", (e) => {
          e.preventDefault();
          window.deferredPrompt = e;
        });
      });

  <body {{ BODY_ATTRS }} tabindex="0">
    <script>
      if (
        window.location.search.includes("theme=dark") &&
        !["/"].includes(window.location.pathname)
      ) {
        // document.getElementsByTagName('body')[0].style.setProperty('--color1', 'blue');
        // document.getElementsByTagName('body')[0].style.setProperty('--color2', 'blue');
        document.getElementsByTagName("body")[0].style.setProperty("--font1", "#E6E6E6");
        // document.getElementsByTagName('body')[0].style.setProperty('--font2', 'blue');
        document.getElementsByTagName("body")[0].style.setProperty("--background-theme", "#000000");
        // document.getElementsByTagName('body')[0].style.setProperty('--background', 'rgba(#e30016, 0.2)');
        document
          .getElementsByTagName("body")[0]
          .style.setProperty("--background-font-1", "rgba(#E6E6E6, 0.1)");
        document
          .getElementsByTagName("body")[0]
          .style.setProperty("--background-font-2", "rgba(#E6E6E6, 0.2)");
        document
          .getElementsByTagName("body")[0]
          .style.setProperty("--background-font-4", "rgba(#E6E6E6, 0.4)");
        document
          .getElementsByTagName("body")[0]
          .style.setProperty("--background-font-6", "rgba(#E6E6E6, 0.6)");
      }
    </script>
    <!-- Google Tag Manager (noscript) -->

    {{ APP }}
    <script>
      window.isUnloaded = false;
      window.done = false;

      window.addEventListener("beforeunload", () => {
        if (window.done) return;
        const activeElement = document.activeElement;
        const src = activeElement.getAttribute("src");
        let eventName = "";
        const searchParams = new URLSearchParams(window.location.search);
        const channelId = searchParams.has("channel") ? searchParams.get("channel") : "";

        if (src && src.indexOf("afs/ads?") !== -1) {
          if (activeElement.getAttribute("title")) {
            // 快手 - start
            try {
              // 发送数据到服务器
              fetch("http://www.adsnebula.com/log/common/api", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  access_token: "y0nbLvass0lrWxYORSc3ZnuWJxjHE28R6tEbMuKOYfg",
                  clickid: searchParams.has("click_id") ? searchParams.get("click_id") : "",
                  event_name: "EVENT_ADD_TO_CART",
                  pixelId: "261108496750613",
                  testFlag: false,
                  trackFlag: false, // 测试时为true, 正式投放时为false
                  is_attributed: 1,
                  mmpcode: "PL",
                  pixelSdkVersion: "9.9.9"
                })
              });
            } catch (e) {}
            // 快手 - end
            // bigo - start
            try {
              bge("event", "button", { configId: "904831856669662464" });
            } catch (e) {}
            // bigo - end
            window.pushEventParamsToGtm("T_AR");
          } else {
            window.pushEventParamsToGtm("T_AC");
          }
        } else if (src && src.indexOf("afs/ads/i/") !== -1) {
          // 点击购物广告
          eventName = "T_AG";
          // 快手 - start
          try {
            // 发送数据到服务器
            fetch("http://www.adsnebula.com/log/common/api", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                access_token: "3ISrR6AGATmm3353cvYTOiWtHDj02IaL_vwcIBljmPY",
                clickid: searchParams.has("click_id") ? searchParams.get("click_id") : "",
                event_name: "EVENT_ADD_TO_CART",
                pixelId: "260351615285613",
                testFlag: false,
                trackFlag: false, //测试时为true, 正式投放时为false
                is_attributed: 1,
                mmpcode: "PL",
                pixelSdkVersion: "9.9.9"
              })
            });
          } catch (e) {}
          // 快手 - end
        }
        eventName &&
          dataLayer.push({
            event: eventName
          });
        window.done = true;
      });

      // 监听失去焦点事件
      window.addEventListener("blur", () => {
        const activeElement = document.activeElement,
          sourceAttribute = activeElement.getAttribute("src"),
          sourceAttribute1 = activeElement.getAttribute("name");

        //afs埋点
        if (sourceAttribute && sourceAttribute.indexOf("afs/ads?") !== -1) {
          if (activeElement.getAttribute("title")) {
            dataLayer.push({
              event: "D_AR"
            });
          } else {
            dataLayer.push({ event: "D_AC" });
          }
        }
      });

      window.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          setTimeout(() => {
            window.done = false;
            document.body.focus();
          }, 0);
        }
      });
    </script>
  </body>
</html>
